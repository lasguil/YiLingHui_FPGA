# Second-board Sapphire JTAG adapter configuration.
# FT4232 EEPROM has no usable serial/description per the board bring-up notes;
# load mode therefore requires --location or --serial at the wrapper level.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
ftdi channel 1
ftdi layout_init 0x08 0x0b
adapter speed 800
adapter srst delay 260
jtag_ntrst_delay 250
transport select jtag
