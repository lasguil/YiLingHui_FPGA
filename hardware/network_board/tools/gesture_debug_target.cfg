# Board-local equivalent of EfxSapphireSoc/openocd/debug_ti.cfg.
# Paths are anchored to this file, never to the first-board project cwd.
set CPUTAPID 0x10660A79
set _CPUTAPID $CPUTAPID
set _ENDIAN little
set gesture_tools_dir [file dirname [info script]]

gdb_target_description disable
jtag newtap fpga_spinal bridge -expected-id $_CPUTAPID -irlen 5 -ircapture 0x5 -irmask 0xF
target create fpga_spinal.cpu0 vexriscv -endian $_ENDIAN \
    -chain-position fpga_spinal.bridge -coreid 0 \
    -dbgbase 0x10B80000 -work-area-phys 0xF9000000 -work-area-size 1024
vexriscv readWaitCycles 40
vexriscv cpuConfigFile [file join $gesture_tools_dir gesture_cpu0.yaml]
vexriscv jtagMapping 8 8 0 1 2 2
targets fpga_spinal.cpu0
poll_period 50
